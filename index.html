<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ALEX // Diagnostic HUD</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at center, #020b18 0%, #000205 100%);
      color: #38bdf8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 10px;
      overflow: hidden;
    }

    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
      opacity: 0.5;
    }

    .hud-frame {
      position: absolute;
      top: 5px; left: 5px; right: 5px; bottom: 5px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      pointer-events: none;
      z-index: 9;
    }

    .hud-header {
      position: relative;
      z-index: 11;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 2px solid rgba(56, 189, 248, 0.4);
      padding: 4px 8px;
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: rgba(56, 189, 248, 0.7);
      text-transform: uppercase;
    }
    .hud-header div:nth-child(2) { text-align: center; font-weight: bold; font-size: 0.75rem; color: #fff; text-shadow: 0 0 8px #38bdf8; }
    .hud-header div:nth-child(3) { text-align: right; color: #00ffcc; }

    .dashboard {
      position: relative;
      z-index: 11;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex: 1;
      width: 100%;
      padding: 6px 0;
    }

    .ai-name {
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 6px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
      margin-bottom: 4px;
    }

    /* Diagnostic Log Box */
    .log-panel {
      width: 100%;
      flex: 1;
      background: rgba(4, 16, 32, 0.95);
      border: 1px solid #00ffcc;
      border-radius: 3px;
      padding: 10px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.65rem;
      color: #00ffcc;
      line-height: 1.4;
      word-break: break-all;
    }

    .hud-footer {
      position: relative;
      z-index: 11;
      border-top: 2px solid rgba(56, 189, 248, 0.4);
      padding: 8px;
      min-height: 40px;
      font-size: 0.65rem;
      color: #fff;
      background: rgba(0, 255, 204, 0.15);
      letter-spacing: 1px;
      text-align: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="hud-frame"></div>

  <div class="hud-header">
    <div>DIAGNOSTIC</div>
    <div id="time-box">06:30</div>
    <div>SYS.TEST</div>
  </div>

  <div class="dashboard">
    <div class="ai-name">ALEX // DEBUG MODE</div>
    <div class="log-panel" id="logBox">
      [System Initialized. Waiting for screen tap...]
    </div>
  </div>

  <div class="hud-footer" id="tapPrompt">
    [TAP HERE TO RUN SPEECH DIAGNOSTIC]
  </div>

  <script>
    const logBox = document.getElementById("logBox");

    function log(msg) {
      console.log(msg);
      logBox.innerHTML += `<br>> ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    log("Checking window.speechSynthesis support...");
    if (!('speechSynthesis' in window)) {
      log("ERROR: window.speechSynthesis NOT supported on this browser!");
    } else {
      log("SUCCESS: Speech synthesis API is present.");
    }

    function runDiagnostic() {
      log("--- TAP EVENT FIRED ---");
      
      const voices = window.speechSynthesis.getVoices();
      log(`Total voices detected in browser: ${voices.length}`);

      if (voices.length === 0) {
        log("WARNING: Voice array is empty! Mobile browser might be blocking or delaying voices.");
      } else {
        // Print first 5 available voices to see what the phone actually has
        voices.slice(0, 5).forEach((v, i) => {
          log(`Voice [${i}]: ${v.name} (${v.lang})`);
        });
      }

      // Try matching target voice
      const targetVoice = voices.find(v => v.name.includes('Google UK English Male')) 
                       || voices.find(v => v.lang === 'en-GB' && v.name.toLowerCase().includes('male'))
                       || voices.find(v => v.lang === 'en-GB')
                       || voices[0];

      if (targetVoice) {
        log(`SELECTED VOICE: ${targetVoice.name} (${targetVoice.lang})`);
      } else {
        log("ERROR: Could not find any suitable voice!");
        return;
      }

      log("Canceling previous speech queues...");
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance("Diagnostic test audio operational.");
      utterance.voice = targetVoice;
      utterance.rate = 0.95;
      utterance.pitch = 0.90;

      utterance.onstart = () => log("EVENT: utterance.onstart fired!");
      utterance.onend = () => log("EVENT: utterance.onend fired successfully.");
      utterance.onerror = (e) => log(`ERROR: utterance.onerror -> ${e.error}`);

      log("Executing window.speechSynthesis.speak()...");
      window.speechSynthesis.speak(utterance);
      
      document.getElementById("tapPrompt").textContent = "[TEST EXECUTED - CHECK LOGS ABOVE]";
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => {
        log(`onvoiceschanged fired. Voices loaded: ${window.speechSynthesis.getVoices().length}`);
      };
    }

    window.addEventListener("pointerdown", runDiagnostic, { once: true });
  </script>
</body>
</html>
